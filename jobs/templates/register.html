{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container" style="max-width:480px">
  <div class="card" style="margin-top:2rem">
    <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;text-align:center">Create Account</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Create a password">
      </div>
      <div class="form-group">
        <label>I am a</label>
        <select name="role">
          <option value="seeker">Job Seeker</option>
          <option value="employer">Employer</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">Register</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:0.875rem;color:var(--muted)">Already have an account? <a href="{% url 'login' %}" style="color:var(--primary)">Login</a></p>
  </div>
</div>
{% endblock %}
