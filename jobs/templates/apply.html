{% extends 'base.html' %}
{% block title %}Apply - {{ job.title }}{% endblock %}
{% block content %}
<div class="container" style="max-width:560px">
  <div class="card" style="margin-top:2rem">
    <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:0.25rem">Apply for {{ job.title }}</h2>
    <p style="color:var(--muted);font-size:0.875rem;margin-bottom:1.5rem">{{ job.employer.profile.company_name|default:job.employer.username }} · {{ job.location }}</p>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Cover Letter</label>
        <textarea name="cover_letter" required placeholder="Tell the employer why you're a great fit..." style="min-height:160px"></textarea>
      </div>
      <div style="display:flex;gap:0.75rem">
        <button type="submit" class="btn btn-primary" style="flex:1;padding:12px">Submit Application</button>
        <a href="{% url 'job_detail' job.pk %}" class="btn btn-outline" style="padding:12px 20px">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
