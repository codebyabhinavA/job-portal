{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container" style="max-width:480px">
  <div class="card" style="margin-top:2rem">
    <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;text-align:center">Welcome Back</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Your username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">Login</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:0.875rem;color:var(--muted)">No account? <a href="{% url 'register' %}" style="color:var(--primary)">Register</a></p>
  </div>
</div>
{% endblock %}
